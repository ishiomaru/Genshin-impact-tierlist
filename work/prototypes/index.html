<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>中心体験の比較試作 / TEYVAT ATLAS</title><style>
body{margin:0;background:#f4f5ed;color:#2d483b;font:14px/1.8 sans-serif}main{max-width:960px;margin:auto;padding:30px 22px}button{font:inherit;cursor:pointer;border:1px solid #b8c9ad;border-radius:4px;padding:9px 16px;color:inherit;background:#fffef8}button.active{background:#2b6657;color:white}nav{display:flex;gap:10px;margin-bottom:25px}h1{font:32px/1.6 serif}h2{font:24px/1.7 serif}p{color:#7d8f6b}.row{display:flex;gap:18px;padding:18px;background:#fffef7;border:1px solid #d5dfc8;margin:10px 0;align-items:center}.tier{font:30px Georgia,serif;width:55px}.cards{display:flex;gap:13px;flex-wrap:wrap}.card{width:150px;padding:12px;display:flex;flex-direction:column;align-items:center;font-size:12px}.card img{width:65px;height:65px;border-radius:100%;background:#e3edd8}.detail{background:#e8efdf;padding:20px;border-radius:5px;margin-top:20px}select{padding:8px;border:1px solid #b6caaa;background:white;color:inherit;font:inherit}.chart{display:flex;align-items:center;gap:12px;margin-top:9px}.track{height:7px;width:130px;background:#d9e2ca}.track i{display:block;height:100%;background:#68927d}.lab{display:grid;grid-template-columns:1fr 1fr;gap:13px}.lab>.row{display:block}.note{font-size:12px;border-top:1px solid #c3d0b8;padding-top:18px;margin-top:22px}@media(max-width:600px){.lab{grid-template-columns:1fr}.card{width:105px}.row{gap:10px;padding:12px}.cards{gap:7px}}
</style><main><span>実データによる中心操作の比較 / 制作記録</span><h1>Tierを見渡すか、条件差から読むか。</h1><nav><button id="a" class="active">A / Tierボード</button><button id="b">B / 条件比較ラボ</button></nav><label>評価条件 <select id="profile"><option value="balanced">総合バランス</option><option value="theater">シアター重視</option></select></label><div id="app"></div><p class="note" id="note"></p><div id="detail"></div></main><script type="module">
import {tierFor,PROFILES} from '/src/model.mjs';
const data=await(await fetch('/src/data/research.json')).json();const names=['サンドローネ','ヌヴィレット','スクロース'];const records=data.records.filter(c=>names.includes(c.name));let mode='a';const profile=document.querySelector('#profile');
function render(){const weights=PROFILES.find(p=>p.id===profile.value).weights;document.querySelector('#a').className=mode==='a'?'active':'';document.querySelector('#b').className=mode==='b'?'active':'';
const card=c=>`<button class="card" data-id="${c.id}"><img src="${c.portrait}" alt=""><b>${c.name}</b><span>${c.group==='主'?'主対象':'派生・ドライバー'}</span></button>`;
document.querySelector('#app').innerHTML=mode==='a'?['SS','S','A'].map(t=>{const chars=records.filter(c=>tierFor(c.scores,weights)===t);return chars.length?`<div class="row"><span class="tier">${t}</span><div class="cards">${chars.map(card).join('')}</div></div>`:''}).join(''):`<div class="lab">${records.map(c=>`<div class="row">${card(c)}<h2>基準 ${c.tier} → 現在 ${tierFor(c.scores,weights)}</h2>${c.scores.map((s,i)=>`<div class="chart"><span>${['螺旋','幽境','シアター'][i]}</span><span class="track"><i style="width:${s*20}%"></i></span>${s}</div>`).join('')}<p>${c.caveat}</p></div>`).join('')}</div>`;
document.querySelector('#note').textContent=mode==='a'?'A：全体像と対象探しが容易。主対象と派生を分離せず同じTier内で比較。条件の理由はカードを開く一手が必要。':'B：条件による差と留保を読み比べやすい。77運用をそのまま並べると密度と縦長化が大きく、全体探索が苦手。';
document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{const c=records.find(c=>c.id===b.dataset.id);document.querySelector('#detail').innerHTML=`<section class="detail"><h2>${c.name} / ${tierFor(c.scores,weights)}</h2><p>${c.verdict}</p><strong>制約・留保</strong><p>${c.caveat}</p><strong>代表的な味方3枠</strong><p>${c.team}</p><small>著者の判断。実測DPSではありません。スクロースの評価は本人の直接火力だけを表しません。</small></section>`;});}
document.querySelector('#a').onclick=()=>{mode='a';render()};document.querySelector('#b').onclick=()=>{mode='b';render()};profile.onchange=render;render();
</script></html>
